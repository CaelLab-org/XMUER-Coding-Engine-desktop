<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>XMUER Coding Engine</title>
<style>
  /* 启动画面。视觉参考两处（用户 2026-10-04 指定）：
       - GoodPlanCraftLauncher 的 renderer/splash.html：深色渐变底、圆角 logo 块 + 呼吸光晕、
         品牌名里挑字母高亮、飘浮粒子、0.5s 淡出；
       - ZCode Desktop 的 packages/desktop/src/renderer/index.html：logo 用 0.72s 的
         cubic-bezier(.22,1,.36,1) 弹入（带 overshoot），退场按「动画演完 && 页面就绪」两个条件。
     颜色仍然是 XCE 自己的品牌蓝（AGENTS.md「品牌」：135deg #08122a → #1b3d82 → #0c1b36，
     渐变只保留同色系，禁止跨色相）。整个文件自包含，不引外部资源。 */

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #08122a;
    color: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .screen {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    background:
      radial-gradient(circle at 50% 36%, rgba(43, 111, 236, 0.42) 0%, rgba(43, 111, 236, 0) 60%),
      linear-gradient(135deg, #08122a 0%, #1b3d82 50%, #0c1b36 100%);
    /* 整块淡出（GPCL 的 fade-out）：主进程收起启动画面时加 .closing */
    transition: opacity 0.18s ease;
  }

  .screen.closing { opacity: 0; }

  /* 点阵网格（跟首页 hero 同一层） */
  .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.10) 1px, transparent 1px);
    background-size: 18px 18px;
    -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
    mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
  }

  /* logo 块：GPCL 的圆角渐变方块 + 呼吸光晕 */
  .tile {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 84px;
    height: 84px;
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(76, 151, 255, 0.26), rgba(43, 111, 236, 0.10));
    color: #9cc2ff;
    /* ZCode 的弹入：0.66s、先冲过一点再收回来 */
    opacity: 0;
    transform: scale(0.72);
    animation: pop 0.66s cubic-bezier(0.22, 1, 0.36, 1) forwards,
               glow 2.6s ease-in-out 0.66s infinite;
  }

  @keyframes pop {
    0% { opacity: 0; transform: scale(0.72); }
    38% { opacity: 1; transform: scale(1.045); }
    58% { transform: scale(0.985); }
    76% { transform: scale(1.008); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 0 22px rgba(43, 111, 236, 0.45); }
    50% { box-shadow: 0 0 40px rgba(76, 151, 255, 0.70); }
  }

  .name {
    position: relative;
    margin-top: 18px;
    opacity: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.3px;
    animation: rise 0.5s ease-out 0.16s forwards;
  }

  /* GPCL 的写法：品牌名里挑字母高亮成主色 */
  .name .hl { color: #7fb0ff; font-weight: 700; }

  .stage {
    position: relative;
    margin-top: 7px;
    opacity: 0;
    color: rgba(255, 255, 255, 0.66);
    font-size: 12px;
    letter-spacing: 0.2px;
    animation: rise 0.5s ease-out 0.24s forwards;
  }

  .meta {
    position: relative;
    margin-top: 4px;
    opacity: 0;
    color: rgba(255, 255, 255, 0.36);
    font-size: 11px;
    animation: rise 0.5s ease-out 0.32s forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 不定态进度：一条品牌蓝来回走。不写百分比 —— 免得假装知道还要多久。 */
  .bar {
    position: absolute;
    left: 50%;
    bottom: 30px;
    width: 164px;
    height: 3px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.13);
    transform: translateX(-50%);
  }

  .bar::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 42%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(43, 111, 236, 0), #4c97ff, rgba(43, 111, 236, 0));
    animation: slide 1.35s ease-in-out infinite;
  }

  @keyframes slide {
    0% { transform: translateX(-105%); }
    100% { transform: translateX(340%); }
  }

  /* GPCL 的飘浮粒子：一层很淡的点慢慢往上飘，不做主角 */
  .particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    bottom: -8px;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(124, 176, 255, 0.5);
    opacity: 0;
    animation: drift linear infinite;
  }

  @keyframes drift {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    12% { opacity: 1; }
    88% { opacity: 1; }
    100% { transform: translateY(-330px) translateX(14px); opacity: 0; }
  }

  /* 系统设了「减少动态效果」就全关（ZCode 也这么做）：静止的界面照样看得懂 */
  @media (prefers-reduced-motion: reduce) {
    .tile, .name, .stage, .meta { animation: none; opacity: 1; transform: none; }
    .bar::after, .particle { animation: none; }
    .particle { display: none; }
  }
</style>
</head>
<body>
  <div class="screen" id="screen">
    <div class="particles" id="particles"></div>
    <div class="tile">
      <svg aria-hidden="true" height="50" viewBox="0 0 24 24" width="50">
        <path d="M12 2.2 20.7 7.1v9.8L12 21.8 3.3 16.9V7.1z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="0.9"/>
        <path d="M12 7.1 16.7 9.8v5.4L12 17.9 7.3 15.2V9.8z" fill="currentColor" opacity="0.32"/>
        <path d="M12 9.4l3.1 1.8v3.5L12 16.5l-3.1-1.8V11.2z" fill="currentColor" opacity="0.55"/>
      </svg>
    </div>
    <div class="name">XMUER <span class="hl">Coding</span> Engine</div>
    <div class="stage" id="stage">正在启动…</div>
    <div class="meta" id="meta">虚舟实验室 · CaelLab</div>
    <div class="bar"></div>
  </div>

  <script>
    (function () {
      'use strict';

      // 版本号由主进程用 loadFile({query}) 传进来，避免多写一处版本
      var version = new URLSearchParams(location.search).get('v');
      var meta = document.getElementById('meta');
      if (version) {
        meta.textContent = 'v' + version + ' · 虚舟实验室 · CaelLab';
      }

      // 主进程用 executeJavaScript 调这个改阶段文案（真的在干嘛就说干嘛，别演）
      window.__stage = function (text) {
        if (typeof text === 'string' && text) document.getElementById('stage').textContent = text;
      };

      // 粒子：固定的分布参数由 JS 生成（写死在 HTML 里太啰嗦）
      var box = document.getElementById('particles');
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (var i = 0; i < 18; i++) {
          var dot = document.createElement('div');
          dot.className = 'particle';
          dot.style.left = (Math.random() * 100).toFixed(1) + '%';
          dot.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
          dot.style.animationDuration = (4.5 + Math.random() * 4).toFixed(2) + 's';
          box.appendChild(dot);
        }
      }
    })();
  </script>
</body>
</html>
